<section class="card">
  <div class="card-title-row">
    <h2>Boekhoudkundige export</h2>
    <a class="btn-secondary small" routerLink="/accounting">← Overzicht</a>
  </div>

  @if (loading()) {
    <p class="status">Bezig met laden...</p>
  } @else {
    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }
    @if (notice()) {
      <div class="alert alert-success">{{ notice() }}</div>
    }

    <label>
      Schooljaar
      <select [value]="selectedYear()" (change)="setYear($event)">
        @for (year of years(); track year) {
          <option [value]="year">{{ year }}</option>
        }
      </select>
    </label>

    <p class="muted">{{ previewCount() }} rij(en) beschikbaar voor export.</p>

    <div class="actions actions-row">
      <button type="button" class="btn-primary" [disabled]="exporting()" (click)="export('csv')">
        @if (exporting()) { Bezig... } @else { Download CSV }
      </button>
      <button type="button" class="btn-secondary" [disabled]="exporting()" (click)="export('xls')">
        Download XLS
      </button>
    </div>
  }
</section>
